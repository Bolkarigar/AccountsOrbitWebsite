<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070d1c" />
    <meta name="description" content="AccountsOrbit — Hindi voice-first business management for traders and shopkeepers." />
    <title>AccountsOrbit — Your Business. In Orbit.</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("accountsorbit-theme") || localStorage.getItem("bolkarigar-theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#f3f7fc" : "#070d1c");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
